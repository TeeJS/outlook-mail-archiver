# outlook-mail-archiver configuration — copy to config.toml and edit.
# config.toml is git-ignored; it holds your real instance details and must never
# be committed. Nothing here is written into export packages, manifests, or logs.

[outlook]
# Display name of the Outlook store to read. Leave empty for the default store.
store = ""

[export]
# Where export packages (ZIP + manifest) are written. Private work mail lives
# here; keep it off any public/shared location. Retained for retry until the
# destination import is verified.
staging_dir = "D:/mail-archive-staging"

# Folders to export. Give explicit paths; nothing is omitted silently.
# Use the Outlook folder path as shown by `outlook-mail-archiver folders`.
# A literal "/" inside a single folder name is written here as "\/".
# Use ["*"] to export the WHOLE mailbox (every folder, one tree walk).
folders = [
    # "*",
    # "Inbox",
    # "Inbox/Projects/2026",
]

# Optional inclusive date range on received time (local), ISO yyyy-mm-dd.
# Leave empty for no bound.
date_from = ""
date_to = ""

# Incremental sync: when true, the export skips any message already in the
# archive (confirmed via the REST API) so repeat runs only pick up NEW mail.
# The first run (empty archive) still exports everything and seeds the state.
# Requires mail_archiver.base_url + api_key + import_account_id below.
incremental = false
# Days of overlap below the verified high-water mark that each incremental run
# re-examines, so nothing is missed at the boundary. A periodic `export --full`
# sweep catches any back-dated or moved mail outside the window.
overlap_days = 14

# Max size per ZIP part. A large export rolls over to messages-02.zip, etc.,
# so each part stays under a web-upload limit (Mail-Archiver default is 10 GB).
max_zip_gb = 9

[mail_archiver]
# Base URL of your Mail-Archiver instance (used only by the import stage).
base_url = ""
# Database ID of the destination IMPORT-type account.
import_account_id = 0
# Scoped REST API key (read-only) for per-message verification (`verify`).
# Created in the Mail-Archiver UI under API Keys. Stays here, never in exports.
api_key = ""
# Path to the Mail-Archiver CLI import, if driving import over SSH/docker exec
# is configured locally. Left empty, the import stage only prints the documented
# command for you to run. Credentials, if any, stay here and never leave config.
# import_command = ""
