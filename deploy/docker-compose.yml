# Mail-Archiver — Unraid Docker Compose (via the Docker Compose Manager plugin).
#
# Full reproduction of your container's settings, PLUS the one thing the recreate
# dropped: Api__Enabled=true (the REST API that verify/incremental need — its
# absence was the 404). Your /app/imports dropbox mount was already present.
#
# Defines ONLY mail-archiver and connects to your EXISTING Postgres container —
# do NOT add a db service: your archived mail lives in the current Postgres at
# 192.168.1.25:5001, and a second one would start empty.
#
# Two secrets the Unraid UI masked: paste them from your current container's
# variables (Docker -> mail-archiver-sync -> Edit) — the whole DB connection
# string, and the admin password. The image tracks :latest — never pin it.

services:
  mail-archiver:
    image: s1t5/mailarchiver:latest
    container_name: mail-archiver          # the import watcher targets this exact name
    restart: unless-stopped
    ports:
      - "5150:5000"                        # host:container (your NPM Plus host forwards to 5150)

    environment:
      # --- database: your existing Postgres (paste the full value incl. user+password) ---
      ConnectionStrings__DefaultConnection: "Host=192.168.1.25;Port=5001;Database=mailarchiver;Username=PASTE_DB_USER;Password=PASTE_DB_PASSWORD"

      # --- authentication ---
      Authentication__Enabled: "true"
      Authentication__Username: "admin"
      Authentication__Password: "PASTE_ADMIN_PASSWORD"
      Authentication__SessionTimeoutMinutes: "60"
      Authentication__CookieName: "MailArchiverAuth"

      # --- display ---
      TimeZone__DisplayTimeZoneId: "Etc/UTC"

      # --- REST API: the setting that was missing -> fixes the 404 ---
      Api__Enabled: "true"

      # --- mail sync ---
      MailSync__IntervalMinutes: "15"
      MailSync__TimeoutMinutes: "60"
      MailSync__ConnectionTimeoutSeconds: "180"
      MailSync__CommandTimeoutSeconds: "300"
      MailSync__AlwaysForceFullSync: "false"
      MailSync__IgnoreSelfSignedCert: "false"

      # --- batch restore ---
      BatchRestore__AsyncThreshold: "50"
      BatchRestore__MaxSyncEmails: "150"
      BatchRestore__MaxAsyncEmails: "50000"
      BatchRestore__SessionTimeoutMinutes: "30"
      BatchRestore__DefaultBatchSize: "50"

      # --- batch operation ---
      BatchOperation__BatchSize: "50"
      BatchOperation__PauseBetweenEmailsMs: "50"
      BatchOperation__PauseBetweenBatchesMs: "250"

      # --- selection / database / upload limits ---
      Selection__MaxSelectableEmails: "250"
      Npgsql__CommandTimeout: "900"
      Upload__MaxFileSizeGB: "10"
      Upload__KeepAliveTimeoutHours: "4"
      Upload__RequestHeadersTimeoutHours: "2"

    volumes:
      - /mnt/user/appdata/mailarchiver/data-protection-keys:/app/DataProtection-Keys
      - /mnt/user/archives/outlook-email-archiver:/app/imports   # the import dropbox
