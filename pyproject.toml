[project]
name = "outlook-mail-archiver"
version = "0.1.0"
description = "Archive mail from classic Outlook Desktop into a self-hosted Mail-Archiver instance via local COM — no Microsoft Graph."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TeeJS" }]
keywords = ["outlook", "com", "email", "archive", "eml", "mail-archiver", "windows"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
]
dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
outlook-mail-archiver = "outlook_mail_archiver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outlook_mail_archiver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
